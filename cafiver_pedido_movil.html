<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nuevo pedido | Cafiver CRM móvil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = { darkMode: "class", theme: { extend: {
    colors: {
      "surface": "#faf9f9", "background": "#faf9f9",
      "surface-container-lowest": "#ffffff", "surface-container-low": "#f4f3f3",
      "surface-container": "#eeeeee", "surface-container-high": "#e9e8e8", "surface-container-highest": "#e3e2e2",
      "on-surface": "#1a1c1c", "on-surface-variant": "#414752", "outline": "#717784", "outline-variant": "#c0c7d4",
      "primary": "#005da9", "on-primary": "#ffffff", "primary-container": "#0176d3",
      "tertiary": "#086a34", "tertiary-fixed":"#9ff6b0", "on-tertiary-fixed-variant":"#005226", "tertiary-container":"#2e844a", "on-tertiary":"#ffffff",
      "error": "#ba1a1a", "error-container":"#ffdad6", "on-error-container":"#93000a"
    },
    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "2xl": "1rem", "full": "9999px" },
    spacing: { "xs": "0.25rem", "sm": "0.5rem", "md": "1rem", "lg": "1.5rem", "xl": "2rem", "margin-mobile": "1rem" },
    fontFamily: { "sans": ["Hanken Grotesk", "sans-serif"] },
    fontSize: {
      "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
      "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "700"}],
      "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}]
    }
  } } }
</script>
<style>
  body { font-family: 'Hanken Grotesk', sans-serif; -webkit-tap-highlight-color: transparent; min-height: max(884px, 100dvh); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-28 max-w-[420px] mx-auto border-x border-outline-variant/40">
<header class="bg-surface sticky top-0 z-40 border-b border-outline-variant flex items-center gap-3 w-full px-margin-mobile h-16">
  <span class="material-symbols-outlined text-primary">arrow_back</span>
  <h1 class="text-headline-md font-bold text-primary flex-1">Nuevo pedido</h1>
  <span class="flex items-center gap-1 px-2 py-1 bg-tertiary-fixed text-on-tertiary-fixed-variant rounded-full text-label-sm font-bold"><span class="w-1.5 h-1.5 rounded-full bg-tertiary animate-pulse"></span> SAP</span>
</header>

<!-- Cliente -->
<div class="px-margin-mobile py-3 bg-surface border-b border-outline-variant flex items-center gap-3">
  <div class="w-10 h-10 rounded-xl bg-tertiary-fixed text-on-tertiary-fixed-variant flex items-center justify-center font-bold text-label-md">CA</div>
  <div class="flex-1"><p class="font-semibold text-body-md leading-tight">Cafés de Altura S.A.</p><p class="text-label-sm text-on-surface-variant">Huatusco · CEDI Nichos</p></div>
</div>

<main class="px-margin-mobile pt-md">
  <p class="text-label-md text-on-surface-variant uppercase mb-md">Productos</p>
  <div id="list" class="space-y-md"></div>
</main>

<!-- Barra total fija -->
<div class="fixed bottom-16 left-1/2 -translate-x-1/2 w-full max-w-[420px] bg-surface border-t border-outline-variant px-margin-mobile py-3 z-40">
  <div class="flex justify-between items-center mb-2"><span class="text-body-sm text-on-surface-variant" id="count">0 productos</span><div class="text-right"><span class="text-label-sm text-on-surface-variant">Total con IVA</span><p class="text-headline-md font-bold text-primary leading-none" id="tot">$0</p></div></div>
  <button class="w-full bg-primary text-on-primary py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform"><span class="material-symbols-outlined text-[20px]">check_circle</span> Confirmar pedido</button>
</div>

<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[420px] z-50 flex justify-around items-center px-4 h-16 bg-surface border-t border-outline-variant">
  <a class="flex flex-col items-center justify-center text-on-surface-variant" href="#"><span class="material-symbols-outlined">home</span><span class="text-label-sm">Inicio</span></a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant" href="#"><span class="material-symbols-outlined">groups</span><span class="text-label-sm">Clientes</span></a>
  <a class="flex flex-col items-center justify-center bg-secondary-container text-primary rounded-full px-4 py-1" href="#" style="background:#43beff;color:#004a6a"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">receipt_long</span><span class="text-label-sm">Pedidos</span></a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant" href="#"><span class="material-symbols-outlined">map</span><span class="text-label-sm">Rutas</span></a>
</nav>

<script>
  const PROD = [
    {name:'Café en grano · Altura', sku:'CAF-GRA-ALT', stock:420, price:210},
    {name:'Café molido · Espresso', sku:'CAF-MOL-ESP', stock:85, price:225},
    {name:'Café molido · Americano', sku:'CAF-MOL-AME', stock:0, price:198},
    {name:'Descafeinado · Molido', sku:'CAF-DES-MOL', stock:34, price:260},
    {name:'Café orgánico · Grano', sku:'CAF-GRA-ORG', stock:150, price:290},
  ];
  const qty = {}; const mxn = n=>'$'+n.toLocaleString('es-MX');
  function chip(s){ if(s===0)return `<span class="px-2 py-0.5 bg-error-container text-on-error-container rounded-full text-label-sm font-bold">Agotado</span>`; if(s<50)return `<span class="px-2 py-0.5 bg-tertiary-fixed rounded-full text-label-sm font-bold" style="color:#8a6508">${s} kg · bajo</span>`; return `<span class="px-2 py-0.5 bg-tertiary-fixed text-on-tertiary-fixed-variant rounded-full text-label-sm font-bold">${s} kg</span>`; }
  const list = document.getElementById('list');
  function render(){
    list.innerHTML = PROD.map((p,i)=>`
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md ${p.stock===0?'opacity-50':''}">
        <div class="flex justify-between items-start mb-1"><div><p class="font-semibold text-body-md leading-tight">${p.name}</p><p class="text-label-sm text-on-surface-variant">${p.sku} · ${mxn(p.price)}/kg</p></div>${chip(p.stock)}</div>
        <div class="flex items-center justify-between mt-3">
          <span class="text-body-sm text-on-surface-variant">Subtotal: <b class="text-on-surface">${mxn((qty[i]||0)*p.price)}</b></span>
          <div class="flex items-center gap-3">
            <button data-d="${i}" class="dec w-9 h-9 rounded-full border border-outline-variant flex items-center justify-center active:scale-90 ${p.stock===0?'opacity-40':''}"><span class="material-symbols-outlined text-[20px]">remove</span></button>
            <span class="w-10 text-center font-bold text-body-md">${qty[i]||0}</span>
            <button data-a="${i}" class="inc w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center active:scale-90 ${p.stock===0?'opacity-40':''}"><span class="material-symbols-outlined text-[20px]">add</span></button>
          </div>
        </div>
      </div>`).join('');
    document.querySelectorAll('.inc').forEach(b=>b.onclick=()=>{const i=b.dataset.a;if(PROD[i].stock===0)return;qty[i]=Math.min((qty[i]||0)+5,PROD[i].stock);render();});
    document.querySelectorAll('.dec').forEach(b=>b.onclick=()=>{const i=b.dataset.d;qty[i]=Math.max((qty[i]||0)-5,0);render();});
    const lines = PROD.map((p,i)=>({p,q:qty[i]||0})).filter(x=>x.q>0);
    const sub = lines.reduce((a,x)=>a+x.p.price*x.q,0);
    document.getElementById('tot').textContent = mxn(Math.round(sub*1.16));
    document.getElementById('count').textContent = lines.length+' producto'+(lines.length===1?'':'s');
  }
  render();
</script>
</body></html>
